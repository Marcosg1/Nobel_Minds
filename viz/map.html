<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map — Nobel Minds</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"
    integrity="sha512-wNH6xsp2n8CfB91nrBtfc4sfLwYPBMjSWVUwQOp60AYYXH6i8yCwuKFZ4rgK2i6pQek/b+bSyR7b01/922IBzQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, .6);
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>

<body>
  <header>
    <nav class="site-nav" aria-label="Main">
      <a href="../index.html">Home</a>
      <a href="timeline.html">Timeline</a>
      <a href="bar-chart.html">Bar chart</a>
      <a href="line-chart.html">Line chart</a>
      <a href="map.html">Map</a>
    </nav>
    <h1>Nobel Prizes by Country</h1>
  </header>

  <main>
    <div id="chart"></div>
    <div id="tooltip" class="tooltip"></div>
  </main>

  <script>
    const svgWidth = 960;
    const svgHeight = 550;

    const svg = d3.select("#chart")
      .append("svg")
      .attr("width", svgWidth)
      .attr("height", svgHeight);

    // makes the map
    const projection = d3.geoNaturalEarth1()
      .scale(145)
      .translate([svgWidth / 2, (svgHeight / 2) - 20]);

    // makes the path
    const path = d3.geoPath().projection(projection);

    const tooltip = d3.select("#tooltip");

    // loads both datasets
    Promise.all([
      d3.json("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json"),
      d3.csv("../NobelData/raw/Countries.csv")
    ]).then(function ([geoData, countryData]) {

      // maps country with their number of prizes
      const prizeMap = {};
      countryData.forEach(d => {
        prizeMap[d.Country] = +d["Number of prizes"];
      });

      // renames countries to match the map
      const nameAliases = {
        "South Korea": "Korea",
        "Myanmar": "Myanmar (Burma)",
        "Czechia": "Czech Republic"
      };

      // mapped countires that don't have a polygon in the geojson
      const pointCountries = [
        { mapLabel: "Hong Kong", dataName: "Hong Kong", coordinates: [114.1694, 22.3193] },
        { mapLabel: "Faroe Islands", dataName: "Faroe Islands", coordinates: [-6.9118, 61.8926] },
        { mapLabel: "Saint Lucia", dataName: "Saint Lucia", coordinates: [-60.9789, 13.9094] },
        { mapLabel: "Palestine", dataName: "Palestine", coordinates: [35.2332, 31.9522] },
        { mapLabel: "Yugoslavia", dataName: "Yugoslavia", coordinates: [20.46, 44.82] }
      ];

      // gets the number of prizes for a country
      const getPrizeValue = mapName => {
        const dataName = nameAliases[mapName] || mapName;
        return prizeMap[dataName] || 0;
      };

      // color scale in log
      const maxPrizes = d3.max(Object.values(prizeMap));
      const transformValue = value => Math.log1p(value);
      const color = d3.scaleSequential()
        .domain([transformValue(0), transformValue(maxPrizes)])
        .interpolator(d3.interpolateBlues);

      // legend stops
      const legendStops = [0, 1, 3, 10, 30, 100, maxPrizes];

      // draws the map
      svg.selectAll("path")
        .data(geoData.features)
        .enter()
        .append("path")
        .attr("d", path)
        .attr("fill", d => {
          const value = getPrizeValue(d.properties.name);
          return value ? color(transformValue(value)) : "lightgray";
        })
        .attr("stroke", "black")
        .attr("stroke-width", 0.5)
        .on("mouseover", function (event, d) {
          tooltip
            .style("opacity", 1)
            .html(`<strong>${d.properties.name}</strong><br>Prizes: ${getPrizeValue(d.properties.name)}`);
        })
        .on("mousemove", function (event) {
          tooltip
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 20) + "px");
        })
        .on("mouseout", function () {
          tooltip.style("opacity", 0);
        });

      // draws the points for the countries that don't have a polygon in the geojson
      svg.selectAll("circle.missing-country-point")
        .data(pointCountries.filter(d => prizeMap[d.dataName]))
        .enter()
        .append("circle")
        .attr("class", "missing-country-point")
        .attr("cx", d => projection(d.coordinates)[0])
        .attr("cy", d => projection(d.coordinates)[1])
        .attr("r", 3)
        .attr("fill", d => color(transformValue(prizeMap[d.dataName])))
        .attr("stroke", "black")
        .attr("stroke-width", 0.5)
        .on("mouseover", function (event, d) {
          tooltip
            .style("opacity", 1)
            .html(`<strong>${d.mapLabel}</strong><br>Prizes: ${prizeMap[d.dataName]}`);
        })
        .on("mousemove", function (event) {
          tooltip
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 20) + "px");
        })
        .on("mouseout", function () {
          tooltip.style("opacity", 0);
        });

      // draws the legend group in the bottom right corner
      const legendGroup = svg.append("g")
        .attr("class", "legend")
        .attr("transform", "translate(0,500)");

      // creates the legend
      const legend = d3.legendColor()
        .orient("horizontal")
        .shapeWidth(40)
        .shapePadding(2)
        .labelOffset(6)
        .title("Nobel prizes by country")
        .scale(color)
        .cells(legendStops.map(transformValue))
        .labels(legendStops.map(d3.format("d")));

      // draws the legend
      legendGroup.call(legend);

    });
  </script>
</body>

</html>
